# Approved M1 emulator profile; instruction-counting timer confirmed on 2026-11-01.
schema_version = 1
id = "qemu-virt-a53"
version = "0.1.1"
architecture = "aarch64"
rust_target = "aarch64-unknown-none-softfloat"
base_modules = ["kernel", "bsp-qemu-virt"]
supported_features = ["serial-console", "boot-diagnostics"]
artifact_format = "elf"

[emulator]
qemu_version = "11.1.0"
machine = "virt-11.1"
cpu = "cortex-a53"
memory_mib = 128
cores = 1
accelerator = "tcg"
instruction_counting = "auto"
secure = false
virtualization = false
gic_version = 2

[verification]
scope = "emulator"
recipe = "startup-and-panic-v1"
