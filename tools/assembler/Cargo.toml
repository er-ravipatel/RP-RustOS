[package]
name = "rustos-assembler"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
default-run = "rustos"

[[bin]]
name = "rustos"
path = "src/main.rs"

# A host-only workspace, independent of unfinished bare-metal member crates.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
ctrlc = "=3.4.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }

[features]
test-fixtures = []
fault-injection = []

[[bin]]
name = "rustos-fault-fixture"
path = "tests/support/fault_cli.rs"
required-features = ["fault-injection"]

[[bin]]
name = "job-fixture"
path = "tests/support/job_fixture.rs"
required-features = ["test-fixtures"]

[dev-dependencies]
tempfile = "=3.23.0"
