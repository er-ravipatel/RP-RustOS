[workspace]
members = [
    "core/kernel",
    "hal",
    "bsp/qemu-virt",
    "drivers/console",
]
exclude = ["tools/assembler"]
resolver = "2"

[workspace.dependencies]
# Core dependencies
bitflags = "2.4"
spin = "0.9"
volatile = "0.5"
once_cell = { version = "1.19", default-features = false }

# Architecture specific
aarch64-cpu = "10.0"
tock-registers = "0.9"

# Device Tree
fdt = "0.4"

# Logging
log = { version = "0.4", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
